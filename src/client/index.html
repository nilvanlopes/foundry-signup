<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundry Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;650;800&display=swap" rel="stylesheet" />
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <h1 id="page-title">Create Your Foundry Account</h1>

      <section class="card" aria-labelledby="page-title">
        <form id="signup-form" class="form" autocomplete="on">
          <label>
            <span>Username</span>
            <input name="username" autocomplete="username" placeholder="your username" required minlength="3" />
          </label>

          <div id="manual-fields" class="manual-fields">
            <label>
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" placeholder="you@email.com" />
            </label>

            <label>
              <span>Password</span>
              <input name="password" type="password" autocomplete="new-password" minlength="10" />
            </label>

            <label>
              <span>Confirm password</span>
              <input name="passwordRepeat" type="password" autocomplete="new-password" minlength="10" />
            </label>
          </div>

          <p id="message" class="message" role="status" aria-live="polite"></p>

          <button id="submit-button" class="primary" type="submit">Create account</button>
        </form>

        <button id="google-button" class="google-button" type="button" aria-label="Create account with Google">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10 0 19-7.3 19-20 0-1.2-.1-2.3-.4-3.5z" />
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4 5.6l6.2 5.2C37.1 39.2 43 34.8 43 24c0-1.2-.1-2.3-.4-3.5z" />
          </svg>
          Continue with Google
        </button>
      </section>
    </main>
  </body>
</html>
